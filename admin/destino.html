<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="css/admin.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin">
      <aside class="sidebar">
        <h2>TRIP</h2>
        <span>PLANNER</span>

        <nav>
          <a href="dashboard.html" class="ativo">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
          </a>

          <a href="destino.html">
            <i class="fa-solid fa-earth-americas"></i>
            Destinos
          </a>

          <a href="promocoes.html">
            <i class="fa-solid fa-percent"></i>
            Promoções
          </a>

          <a href="pacotes.html">
            <i class="fa-solid fa-plane"></i>
            Pacotes
          </a>

          <a href="contato.html">
            <i class="fa-solid fa-envelope"></i>
            Contatos
          </a>
        </nav>
      </aside>
      <main class="conteudo">
        <header>
          <h1>Gerenciar Destinos</h1>
          <button id="btnSair">Sair</button>
        </header>
        <section class="topo-pagina">
          <h2>Destinos</h2>

          <button id="btnNovo" class="btn-primary">
            <i class="fa-solid fa-plus"></i>

            Novo Destino
          </button>
        </section>

        <section class="lista-destinos">
          <table class="tabela">
            <thead>
              <tr>
                <th>Imagem</th>
                <th>Nome</th>
                <th>País</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyDestinos">
              <tr>
                <td>
                  <img src="../img/card1.jpg" class="thumb" />
                </td>
                <td>Fernando de Noronha</td>
                <td>Brasil</td>
                <td>R$ 2.990</td>
                <td>Praia</td>
                <td>
                  <button class="btn-editar">
                    <i class="fa-solid fa-pen"></i>
                  </button>

                  <button class="btn-excluir">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script type="module" src="js/destinos.js"></script>

    <div class="modal" id="modalDestino">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Novo Destino</h2>

          <button id="fecharModal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="formDestino">
          <div class="grupo">
            <label>Nome</label>
            <input type="text" id="nome" required />
          </div>
          <div class="grupo">
            <label>País</label>
            <input type="text" id="pais" required />
          </div>
          <div class="grupo">
            <label>Região</label>
            <input type="text" id="regiao" />
          </div>
          <div class="grupo">
            <label>Categoria</label>
            <input type="text" id="categoria" />
          </div>
          <div class="grupo">
            <label>Preço</label>
            <input type="number" id="preco" />
          </div>
          <div class="grupo">
            <label>Estrelas</label>
            <input type="number" id="estrelas" min="1" max="5" value="5" />
          </div>
          <div class="grupo">
            <label>Descrição</label>
            <textarea id="descricao" rows="5"></textarea>
          </div>
          <div class="grupo">
            <label>Imagem</label>
            <input type="file" id="imagem" />
          </div>
          <button class="btn-primary" type="submit">Salvar Destino</button>
        </form>
      </div>
    </div>
  </body>
</html>
