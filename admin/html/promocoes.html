<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/media.css" />
    <link rel="stylesheet" href="../css/keyframes.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="admin">
      <aside class="sidebar">
        <h2>TRIP</h2>
        <span>PLANNER</span>
        <nav>
          <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
          <a href="destino.html"><i class="fa-solid fa-earth-americas"></i> Destinos</a>
          <a href="promocoes.html" class="ativo"><i class="fa-solid fa-percent"></i> Promoções</a>
          <a href="pacotes.html"><i class="fa-solid fa-plane"></i> Pacotes</a>
          <a href="contato.html"><i class="fa-solid fa-envelope"></i> Contatos</a>
        </nav>
      </aside>

      <main class="conteudo">
        <header>
          <h1>Gerenciar Promoções</h1>
          <button id="btnSair">Sair</button>
        </header>

        <section class="topo-pagina">
          <h2>Promoções</h2>
          <button id="btnNovo" class="btn-primary">
            <i class="fa-solid fa-plus"></i> Nova Promoção
          </button>
        </section>

        <section class="lista-destinos">
          <table class="tabela">
            <thead>
              <tr>
                <th>Imagem</th>
                <th>Destino</th>
                <th>País</th>
                <th>Região</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Desconto</th>
                <th>Preço Final</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tbodypromocoes"></tbody>
          </table>
        </section>
      </main>
    </div>

    <div class="modal" id="modalPromocoes">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Nova Promoção</h2>
          <button id="fecharModal" type="button">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <form id="form">
          <div class="grupo">
            <label for="nome">Nome do destino</label>
            <input type="text" id="nome" required />
          </div>
          <div class="grupo">
            <label for="pais">País</label>
            <input type="text" id="pais" required />
          </div>
          <div class="grupo">
            <label for="regiao">Região</label>
            <input type="text" id="regiao" />
          </div>
          <div class="grupo">
            <label for="categoria">Categoria</label>
            <select id="categoria">
              <option>Praia</option>
              <option>Montanha</option>
              <option>Cidade</option>
              <option>Natureza</option>
              <option>Aventura</option>
              <option>Luxo</option>
            </select>
          </div>
          <div class="grupo">
            <label for="preco">Preço Original</label>
            <input type="number" id="preco" min="0" step="0.01" required />
          </div>
          <div class="grupo">
            <label for="desconto">Desconto (%)</label>
            <input type="number" id="desconto" min="0" max="100" value="0" required />
          </div>
          <div class="grupo">
            <label for="precoPromocional">Preço Promocional</label>
            <input type="number" id="precoPromocional" min="0" step="0.01" required />
          </div>
          <div class="grupo">
            <label for="inicio">Data de início</label>
            <input type="date" id="inicio" />
          </div>
          <div class="grupo">
            <label for="fim">Data de término</label>
            <input type="date" id="fim" />
          </div>
          <div class="grupo">
            <label for="destaque">Destaque</label>
            <select id="destaque">
              <option value="true">Sim</option>
              <option value="false" selected>Não</option>
            </select>
          </div>
          <div class="grupo">
            <label for="status">Status</label>
            <select id="status">
              <option value="ativa">Ativa</option>
              <option value="inativa">Inativa</option>
            </select>
          </div>
          <div class="grupo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="5"></textarea>
          </div>
          <div class="grupo">
            <label for="imagem">URL da imagem</label>
            <input type="text" id="imagem" placeholder="/user/img/card1.jpg ou https://..." />
          </div>
          <button class="btn-primary" type="submit">Salvar Promoção</button>
        </form>
      </div>
    </div>

    <div class="modal" id="modalExcluir">
      <div class="modal-content modal-confirmacao">
        <h2>Excluir promoção</h2>
        <p>Tem certeza que deseja excluir esta promoção?</p>
        <div class="botoes-confirmacao">
          <button id="cancelarExcluir" class="btn-secundario" type="button">Cancelar</button>
          <button id="confirmarExcluir" class="btn-danger" type="button">Excluir</button>
        </div>
      </div>
    </div>

    <script type="module" src="../JS/promocoes.js"></script>
    <script type="module" src="../JS/admin.js"></script>
  </body>
</html>
