<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/media.css" />
    <link rel="stylesheet" href="../css/keyframes.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin">
      <aside class="sidebar">
        <h2>TRIP</h2>
        <span>PLANNER</span>

        <nav>
          <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
          </a>

          <a href="destino.html">
            <i class="fa-solid fa-earth-americas"></i>
            Destinos
          </a>

          <a href="promocoes.html">
            <i class="fa-solid fa-percent"></i>
            Promoções
          </a>

          <a href="pacotes.html">
            <i class="fa-solid fa-plane"></i>
            Pacotes
          </a>

          <a href="contato.html">
            <i class="fa-solid fa-envelope"></i>
            Contatos
          </a>
        </nav>
      </aside>
      <main class="conteudo">
        <header>
          <h1>Gerenciar Promoções</h1>
          <button id="btnSair">Sair</button>
        </header>
        <section class="topo-pagina">
          <h2>Promoções</h2>

          <button id="btnNovaPromocao" class="btn-primary">
            <i class="fa-solid fa-plus"></i>

            Novo Promoções
          </button>
        </section>

        <section class="lista-destinos">
          <table class="tabela">
            <thead>
                <tr>
                  <th>Imagem</th>
                  <th>Destino</th>
                  <th>País</th>
                  <th>Região</th>
                  <th>Categoria</th>
                  <th>Preço</th>
                  <th>Desconto</th>
                  <th>Preço Final</th>
                  <th>Início</th>
                  <th>Fim</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
            </thead>
            <tbody id="tbodyPromocoes">
              <tr>
                <td><img src="/user/img/card1.jpg" class="thumb" /></td>
                <td>Fernando de Noronha</td>
                <td>Brasil</td>
                <td>Nordeste</td>
                <td>Praia</td>
                <td>R$ 4.200</td>
                <td>30%</td>
                <td>R$ 2.940</td>
                <td>01/08/2026</td>
                <td>31/08/2026</td>
                <td>Ativa</td>
                <td>
                  <button class="btn-editar">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button class="btn-excluir">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script type="module" src="../JS/promocoes.js"></script>
    <script type="module" src="../JS/admin.js"></script>

    <div class="modal" id="modalPromocao">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Nova Promoção</h2>

          <button id="fecharModal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="formPromocao">
          <div class="grupo">
            <label>Nome do destino</label>
            <input type="text" id="nome" required>
          </div>
          <div class="grupo">
              <label>País</label>
              <input type="text" id="pais" required>
          </div>
          <div class="grupo">
              <label>Região</label>
              <input type="text" id="regiao">
          </div>
          <div class="grupo">
              <label>Categoria</label>
              <select id="categoria">
                <option>Praia</option>
                <option>Montanha</option>
                <option>Cidade</option>
                <option>Natureza</option>
                <option>Aventura</option>
                <option>Luxo</option>
              </select>
          </div>
          <div class="grupo">
            <label>Preço Original</label>
            <input
              type="number"
              id="preco"
              min="0"
              step="0.01"
              required>
          </div>

          <div class="grupo">
            <label>Desconto (%)</label>
            <input
                type="number"
                id="desconto"
                min="0"
                max="100"
                value="0">
          </div>

          <div class="grupo">
            <label>Preço Promocional</label>
            <input
              type="number"
              id="precoPromocional"
              min="0"
              step="0.01">
          </div>

          <div class="grupo">
            <label>Data de início</label>
            <input type="date" id="inicio">
          </div>

          <div class="grupo">
            <label>Data de término</label>
            <input type="date" id="fim">
          </div>

          <div class="grupo">
            <label>Destaque</label>

            <select id="destaque">
              <option value="true">Sim</option>
              <option value="false">Não</option>
            </select>
          </div>

          <div class="grupo">
            <label>Status</label>
              <select id="status">
                <option value="ativa">Ativa</option>
                <option value="inativa">Inativa</option>
              </select>
          </div>

          <div class="grupo">
            <label>Descrição</label>
              <textarea
                id="descricao"
                rows="5"
              ></textarea>
          </div>

            <div class="grupo">
                <label>Imagem</label>

                <input
                    type="text"
                    id="imagem"
                    placeholder="img/promocao1.jpg">
            </div>

          <button class="btn-primary" type="submit">
            Salvar Promoção
          </button>
      </form>
      </div>
    </div>
  </body>
</html>
