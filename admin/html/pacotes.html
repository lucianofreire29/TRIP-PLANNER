<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/media.css" />
    <link rel="stylesheet" href="../css/keyframes.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin">
      <aside class="sidebar">
        <h2>TRIP</h2>
        <span>PLANNER</span>
        <nav>
          <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
          <a href="destino.html"><i class="fa-solid fa-earth-americas"></i> Destinos</a>
          <a href="promocoes.html"><i class="fa-solid fa-percent"></i> Promoções</a>
          <a href="pacotes.html" class="ativo"><i class="fa-solid fa-plane"></i> Pacotes</a>
          <a href="contato.html"><i class="fa-solid fa-envelope"></i> Contatos</a>
        </nav>
      </aside>

      <main class="conteudo">
        <header>
          <h1>Gerenciar Pacotes</h1>
          <button id="btnSair">Sair</button>
        </header>

        <section class="topo-pagina">
          <h2>Pacotes</h2>
          <button id="btnNovo" class="btn-primary">
            <i class="fa-solid fa-plus"></i> Novo Pacote
          </button>
        </section>

        <section class="lista-destinos">
          <table class="tabela">
            <thead>
              <tr>
                <th>Imagem</th>
                <th>Título</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Dias</th>
                <th>Criado em</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyPacotes"></tbody>
          </table>
        </section>
      </main>
    </div>

    <div class="modal" id="modalPacotes">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Novo Pacote</h2>
          <button id="fecharModal" type="button">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <form id="form">
          <div class="grupo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required />
          </div>
          <div class="grupo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="5"></textarea>
          </div>
          <div class="grupo">
            <label for="preco">Preço</label>
            <input type="number" id="preco" step="0.01" min="0" required />
          </div>
          <div class="grupo">
            <label for="dias">Quantidade de dias</label>
            <input type="number" id="dias" min="1" step="1" required />
          </div>
          <div class="grupo">
            <label for="imagem">Imagem</label>
            <input
              type="text"
              id="imagem"
              placeholder="/user/img/banner 1.jpg ou https://..."
            />
          </div>
          <button class="btn-primary" type="submit">Salvar Pacote</button>
        </form>
      </div>
    </div>

    <div class="modal" id="modalExcluir">
      <div class="modal-content modal-confirmacao">
        <h2>Excluir pacote</h2>
        <p>Tem certeza que deseja excluir este pacote?</p>
        <div class="botoes-confirmacao">
          <button id="cancelarExcluir" class="btn-secundario" type="button">Cancelar</button>
          <button id="confirmarExcluir" class="btn-danger" type="button">Excluir</button>
        </div>
      </div>
    </div>

    <script type="module" src="../JS/pacotes.js"></script>
    <script type="module" src="../JS/admin.js"></script>
  </body>
</html>
